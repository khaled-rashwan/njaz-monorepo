version: 1
applications:
  # ============================================================
  # 1. THE BACKEND "INFRA" APP (The Source of Truth)
  # CONNECT AS: A new Amplify App pointing to packages/shared-backend
  # ROLE: Deploys the database, auth, and logic for the whole suite.
  # ============================================================
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
        build:
          commands:
            # This is the ONLY app that runs pipeline-deploy
            - cd packages/shared-backend && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
      artifacts:
        baseDirectory: .next # Technically not used for backend-only but required by schema
        files:
          - '**/*'
    appRoot: packages/shared-backend

  # ============================================================
  # 2. FRONTEND CONSUMER APPS (Landing, Dashboard, Dev, etc.)
  # ROLE: Download settings from Infra and build the UI.
  # REQUIREMENT: Set AMPLIFY_BACKEND_APP_ID to the Infra App ID.
  # ============================================================

  # --- LANDING ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/landing
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/landing

  # --- DASHBOARD (app-selector) ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/app-selector
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/app-selector

  # --- ESTEBIAN ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/estebian
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/estebian

  # --- DEV ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/dev
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/dev
