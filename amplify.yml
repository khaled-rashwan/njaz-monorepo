version: 1
applications:
  # ============================================================
  # 1. THE BACKEND "INFRA" APP (The Source of Truth)
  # CONNECT AS: A new Amplify App pointing to packages/shared-backend
  # ROLE: Deploys the database, auth, and logic for the whole suite.
  # ============================================================
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
        build:
          commands:
            # Move to the shared-backend folder to ensure ampx sees the amplify/ directory
            - cd packages/shared-backend && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
            
            # ============================================================
            # SEQUENTIAL DEPLOYMENT SYNC (Branch Aware)
            # ============================================================
            # This script triggers the frontend apps to build sequentially.
            # Define these as Branch-Specific Environment Variables in the Amplify Console:
            # - WEBHOOK_DEV
            # - WEBHOOK_DASHBOARD
            # - WEBHOOK_LANDING
            # - WEBHOOK_ESTEBIAN
            # ============================================================
            - |
              echo "--- Triggering Frontend Builds for Branch: $AWS_BRANCH ---"
              
              trigger_app() {
                local name=$1
                local url=$2
                if [ -n "$url" ] && [ "$url" != "None" ]; then
                  echo ">> Triggering $name Build..."
                  curl -s -X POST -d {} "$url&operation=startbuild" -H "Content-Type:application/json" > /dev/null
                else
                  echo ">> Skipping $name: WEBHOOK_$name not configured for this branch."
                fi
              }

              trigger_app "DEV" "$WEBHOOK_DEV"
              trigger_app "DASHBOARD" "$WEBHOOK_DASHBOARD"
              trigger_app "LANDING" "$WEBHOOK_LANDING"
              trigger_app "ESTEBIAN" "$WEBHOOK_ESTEBIAN"
              trigger_app "SCHOLAR" "$WEBHOOK_SCHOLAR"
      artifacts:
        baseDirectory: .
        files:
          - amplify_outputs.json
    appRoot: packages/shared-backend

  # ============================================================
  # 2. FRONTEND CONSUMER APPS (Landing, Dashboard, Dev, etc.)
  # ROLE: Download settings from Infra and build the UI.
  # REQUIREMENT: Set AMPLIFY_BACKEND_APP_ID to the Infra App ID.
  # ============================================================

  # --- LANDING ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/landing
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/landing

  # --- DASHBOARD (app-selector) ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/app-selector
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/app-selector

  # --- ESTEBIAN ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/estebian
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/estebian

  # --- DEV ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/dev
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/dev

  # --- SCHOLAR ---
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/scholar
            - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AMPLIFY_BACKEND_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/scholar
