version: 1
applications:
  - backend:
      phases:
        build:
          commands:
            - npm ci
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    appRoot: packages/shared-backend
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/landing
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/app-selector
