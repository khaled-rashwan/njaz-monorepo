version: 1
applications:
  # ============================================================
  # LANDING - Uses shared backend from app-selector (dashboard)
  # Set AMPLIFY_BACKEND_APP_ID env var in Amplify Console to the
  # App ID of your app-selector (dashboard) Amplify app.
  # ============================================================
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            # Generate outputs from the shared backend app (app-selector owns the backend)
            - cd apps/landing
            - npx @aws-amplify/backend-cli generate outputs --branch $AWS_BRANCH --app-id ${AMPLIFY_BACKEND_APP_ID:-$AWS_APP_ID}
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/landing

  # ============================================================
  # DASHBOARD (app-selector) - THE BACKEND OWNER
  # This app deploys the shared backend for all apps.
  # Its AWS_APP_ID is what other apps should use as AMPLIFY_BACKEND_APP_ID.
  # ============================================================
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            # This app owns the backend - it deploys it for all apps
            - cd packages/shared-backend && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
            - cd ../../apps/app-selector
            - npx @aws-amplify/backend-cli generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/app-selector

  # ============================================================
  # ESTEBIAN - Uses shared backend from app-selector (dashboard)
  # ============================================================
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/estebian
            - npx @aws-amplify/backend-cli generate outputs --branch $AWS_BRANCH --app-id ${AMPLIFY_BACKEND_APP_ID:-$AWS_APP_ID}
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/estebian

  # ============================================================
  # DEV - Uses shared backend from app-selector (dashboard)
  # ============================================================
  - frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd apps/dev
            - npx @aws-amplify/backend-cli generate outputs --branch $AWS_BRANCH --app-id ${AMPLIFY_BACKEND_APP_ID:-$AWS_APP_ID}
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/dev
