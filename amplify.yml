version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # Force backend deploy here because Amplify Console is skipping the independent backend block
            - cd ../../packages/shared-backend && npm ci && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
            - cd ../../apps/landing
            - npx @aws-amplify/backend-cli generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
            - node ../../scripts/sync-assets.js
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: apps/landing
