name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Mock Amplify Outputs for CI
        run: |
          echo '{}' > amplify_outputs.json
          echo '{}' > apps/scholar/amplify_outputs.json
          echo '{}' > apps/estebian/amplify_outputs.json

      - name: Run Unit Tests
        run: npm test

      - name: Type-check Scholar
        working-directory: apps/scholar
        run: npx tsc --noEmit -p .

      - name: Type-check Estebian
        working-directory: apps/estebian
        run: npx tsc --noEmit -p .
